<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Классный час — Защита суверенитета России</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f1ea;color:#26221a}
header{background:linear-gradient(120deg,#1a2a52,#3a4f8a,#8a1f2d);color:#fff;padding:26px 18px;text-align:center}
header h1{font-size:1.55em;letter-spacing:1px}
header p{opacity:.92;margin-top:6px;font-size:.95em}
#tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px;background:#131c38;position:sticky;top:0;z-index:5}
#tabs button{border:0;background:rgba(255,255,255,.14);color:#fff;padding:9px 13px;border-radius:20px;cursor:pointer;font-size:.9em}
#tabs button.act{background:#d4af37;color:#1a2a52;font-weight:bold}
main{max-width:900px;margin:0 auto;padding:18px}
.tab{display:none}.tab.on{display:block}
h2{color:#1a2a52;margin:10px 0 12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(26,42,82,.1);border-top:3px solid #d4af37}
.era{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ecard{background:#faf7f0;border:2px solid #d8c9a0;border-radius:12px;padding:12px;cursor:pointer;transition:.2s}
.ecard:hover{transform:translateY(-3px);border-color:#8a1f2d}
.ecard b{font-size:1.05em;color:#8a1f2d;display:block}
.ecard span{display:block;font-size:.85em;color:#5c5545;margin-top:4px}
.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.step .n{background:#1a2a52;color:#fff;border-radius:50%;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85em}
.qbox{border-left:4px solid #d4af37;background:#fdfaf2;padding:12px 14px;margin:10px 0;border-radius:0 10px 10px 0}
.qbox b{color:#8a1f2d}
.rid{background:#fff;border:2px solid #d8c9a0;border-radius:14px;padding:14px;margin:12px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:2px solid #3a4f8a;background:#fff;color:#1a2a52;padding:8px 14px;border-radius:20px;cursor:pointer}
.opts button.ok{background:#1a2a52;color:#fff}
.opts
