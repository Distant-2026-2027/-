<style>
:root{--c1:#ff9800;--c2:#4caf50;--c3:#03a9f4;--bg:#fff8ec;--card:#fff;--tx:#333;--acc:#ff6d00;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Verdana,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
header{background:linear-gradient(135deg,#ffb300,#ff6d00);color:#fff;padding:22px 16px;text-align:center;border-radius:0 0 24px 24px}
header h1{font-size:1.7em;letter-spacing:.5px}
header p{opacity:.95;font-size:1em;margin-top:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:2px solid #ffe0b2}
nav button{border:none;border-radius:22px;padding:9px 14px;font-size:.95em;cursor:pointer;background:#fff;color:#795548;font-weight:600;box-shadow:0 2px 4px rgba(0,0,0,.08)}
nav button.on{background:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 10px rgba(0,0,0,.07)}
h2{color:var(--acc);margin-bottom:10px;font-size:1.3em}
.tag{display:inline-block;border-radius:10px;padding:2px 10px;font-size:.8em;color:#fff;margin-bottom:8px}
.g1{background:var(--c3)}.g2{background:var(--c2)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.wcard{border-radius:12px;padding:12px;cursor:pointer;background:#fff;border:2px solid #ffe0b2;transition:.2s}
.wcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.wcard .en{font-weight:700;font-size:1.15em}
.wcard .ru{color:#666;font-size:.92em;margin-top:3px}
.wcard .tr{color:#8d6e63;font-size:.85em;margin-top:2px;font-style:italic}
.wcard .hint{color:#2e7d32;font-size:.85em;margin-top:2px}
.btn{border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--c3);color:#fff;margin:4px 6px 4px 0;font-size:.95em}
.btn.g{background:var(--c2)}.btn.o{background:var(--acc)}
.phr{border-bottom:1px dashed #e0d5c5;padding:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.phr .p-en{font-weight:600}
.phr .p-ru{color:#777;font-size:.92em}
.dl{margin:8px 0;padding:10px 14px;border-radius:14px;max-width:92%;cursor:pointer}
.a{background:#e3f2fd;margin-right:auto}.b{background:#fff3e0;margin-left:auto}
.dl .who{font-weight:700;font-size:.8em;color:#888}
.dl .tra{color:#777;font-size:.92em;margin-top:4px;display:none}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.95em}
th,td{border:1px solid #ead9c0;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#ffe0b2}
.opt{display:block;width:100%;text-align:left;border:2px solid #ffe0b2;background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:1em}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:#4caf50;background:#e8f5e9}
.opt.wrong{border-color:#e53935;background:#ffebee}
.score{font-weight:700;font-size:1.15em;color:var(--acc);margin-top:8px}
.medal{font-size:2.2em;text-align:center;margin-top:8px}
select,input[type=text]{padding:9px;border-radius:10px;border:2px solid #ffe0b2;font-size:1em;width:100%;max-width:420px;margin:4px 0}
.out{background:#f1f8e9;border-radius:12px;padding:14px;margin-top:12px;font-size:1.08em;display:none}
.center{text-align:center}
.note{background:#fff8e1;border-left:4px solid var(--c1);padding:10px 14px;border-radius:8px;font-size:.95em;margin-top:10px}
@media(max-width:600px){header h1{font-size:1.3em}}
</style>
</head>

{e:"🎲",en:"play board games",ru:"играть в настольные игры",ipa:"[плэй борд гэймз]",hint:"board = доска (игровая)",g:1},

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

'<div class="note">💡 Ход урока: слова → фразы → диалог → игры → «Говори сам» → тест. На каждый блок 5–10 минут.</div></div>';}
if(cur===1){h='<div class="card"><h2>📖 Слова</h2><p>Нажми на карточку — слово прозвучит <b>дважды</b>: сначала медленно, потом в обычном темпе.</p>'+
'<span class="tag g1">Досуг подростка</span><div class="words">'+words.filter(function(w){return w.g===1;}).map(wc).join('')+'</div>'+
'<span class="tag g2" style="margin-top:14px">День в скаутском клубе (Unit 4c)</span><div class="words">'+words.filter(function(w){return w.g===2;}).map(wc).join('')+'</div></div>';}
if(cur===2){h='<div class="card"><h2>💬 Полезные фразы</h2><button class="btn" onclick="speakAll()">🔊 Прослушать все</button><div id="phrs">'+
phrases.map(function(p,i){return '<div class="phr"><div><div class="p-en">'+p.en+'</div><div class="p-ru">'+p.ru+'</div></div><button class="btn" onclick="speak(phrases['+i+'].en)">🔊</button></div>';}).join('')+'</div>'+
'<h2 style="margin-top:18px">📝 Грамматическая шпаргалка</h2>'+grammar.map(function(g){return '<div class="note"><b>'+g.t+'</b><br>'+g.b+'</div>';}).join('')+'</div>';}

dialogue.map(function(d,i){return '<div class="dl '+(d.a?'a':'b')+'" onclick="togle('+i+')"><span class="who">'+d.who+'</span><br>'+d.en+' <span class="btn" style="padding:2px 8px" onclick="event.stopPropagation();speak(dialogue['+i+'].en)">🔊</span><div class="tra" id="tr'+i+'">'+d.ru+'</div></div>';}).join('')+
'<div class="card"><b>Вопросы на понимание:</b>'+dq.map(function(q,i){return '<div style="margin-top:10px"><b>'+(i+1)+'. '+q.q+'</b>'+q.opts.map(function(o,j){return '<button class="opt" onclick="dcheck(this,'+i+','+j+')">'+o+'</button>';}).join('')+'</div>';}).join('')+'</div></div>';}

function wc(w){return '<div class="wcard" onclick="sayTwice(\''+w.en.replace(/'/g,"\\'")+'\')"><div class="en">'+w.e+' '+w.en+'</div><div class="ru">'+w.ru+'</div><div class="tr">'+w.ipa+'</div><div class="hint">💡 '+w.hint+'</div></div>';}

function dcheck(b,qi,oi){var ok=dq[qi].c===oi;b.classList.add(ok?'right':'wrong');if(!ok)b.style.opacity=.7;}

var sp={day:null,acts:[null,null,null],why:null};
function spMark(b){Array.prototype.forEach.call(b.parentNode.children,function(c){c.style.outline='';});b.style.outline='3px solid #ff6d00';spShow();}
function spShow(){if(!sp.day||!sp.acts[0]||!sp.acts[1]||!sp.acts[2]||!sp.why)return;
var t='My favourite day is '+sp.day+'. In the morning I usually '+sp.acts[0].replace(/^I /,'').replace(/^(surf|meet|play|go|do|watch|tell|put)/,'$1')+'. In the afternoon I '+sp.acts[1].replace(/^I /,'')+'. In the evening I '+sp.acts[2].replace(/^I /,'')+'. I love '+sp.day+' because '+sp.why+'.';
var o=document.getElementById('spout');o.style.display='block';o.innerHTML='<b>Твой рассказ:</b><br>'+t+'<br><button class="btn o" onclick="sayTwice(this.previousSibling.textContent)">🔊 Прослушать</button>';
o.querySelector('button').onclick=function(){sayTwice(t);};}
var rs=0,rans=[];
function ridInit(){var box=document.getElementById('rid');box.innerHTML=riddles.map(function(r,i){return '<div style="margin:12px 0"><b>'+(i+1)+'.</b> '+r.q+r.opts.map(function(o,j){return '<button class="opt" onclick="rcheck(this,'+i+','+j+')">'+o+'</button>';}).join('')+'</div>';}).join('');}
function rcheck(b,i,j){if(rans[i]!==undefined)return;rans[i]=j;var ok=riddles[i].c===j;if(ok){rs++;b.classList.add('right');}else{b.classList.add('wrong');}document.getElementById('rscore').textContent='Баллов: '+rs+' из 8';if(ok)speak(riddles[i].opts[j]);}
var gscore=0;
function gapCheck(){gscore=0;gaps.forEach(function(g,i){var v=document.getElementById('gap'+i).value.trim().toLowerCase();var ok=v===g.a.toLowerCase();document.getElementById('gr'+i).textContent=ok?'✅ Верно!':'❌ Правильно: '+g.a;document.getElementById('gr'+i).style.color=ok?'#2e7d32':'#c62828';if(ok)gscore++;});
document.getElementById('gscore').textContent='Правильных: '+gscore+' из 8';gaps.forEach(function(g,i){var v=document.getElementById('gap'+i).value.trim().toLowerCase();if(v===g.a.toLowerCase())speak(g.b+g.a+g.c);});}
var tscore=0,tans=[],tdata=[];
function testInit(){tdata=test.map(function(t){var idx=shuffle(t.opts.map(function(_,i){return i;}));return {q:t.q,opts:idx.map(function(k){return t.opts[k];}),c:idx.indexOf(t.c)};});
document.getElementById('tq').innerHTML=tdata.map(function(t,i){return '<div style="margin:12px 0"><b>'+(i+1)+'. '+t.q+'</b>'+t.opts.map(function(o,j){return '<button class="opt" onclick="tcheck(this,'+i+','+j+')">'+o+'</button>';}).join('')+'</div>';}).join('');}
function tcheck(b,i,j){if(tans[i]!==undefined)return;tans[i]=j;var ok=tdata[i].c===j;if(ok)tscore++;b.classList.add(ok?'right':'wrong');
document.getElementById('tscore').textContent='Баллов: '+tscore+' из 10';
if(tans.length===10){var m=document.getElementById('tmedal');if(tscore>=9)m.textContent='🥇 Отлично! Золотая медаль!';else if(tscore>=7)m.textContent='🥈 Здорово! Серебряная медаль!';else if(tscore>=5)m.textContent='🥉 Хорошо! Бронзовая медаль!';else m.textContent='💪 Ещё раз пройди слова и игры — и всё получится!';}}
render();
</script>
</body>
</html>
