function build(){
 const M=document.getElementById('main');
 const tabs=[renderGoal(),renderWords(),renderPhrases(),renderHobby(),renderDialogue(),renderRiddle(),renderGap(),renderSpeak(),renderTest(),renderHw()];
 M.innerHTML=tabs.map((h,i)=>'<div class="tab'+(i===0?' on':'')+'" id="tab'+i+'">'+h+'</div>').join('');
}
buildNav();build();
document.getElementById('main').addEventListener('click',e=>{
 const t=e.target;
 const w=t.closest('[data-w]');
 if(w){const i=+w.dataset.w;sayWord2(WORDS[i][0]);const h=document.getElementById('hint');if(h)h.innerHTML='<b>'+WORDS[i][0]+'</b> '+WORDS[i][1]+' — '+WORDS[i][2]+'. Подсказка: '+WORDS[i][3];return;}
 const hw=t.closest('[data-h]');
 if(hw){const i=+hw.dataset.h;sayWord2(HOBBY[i][0]);const h=document.getElementById('hhint');if(h)h.innerHTML='<b>'+HOBBY[i][0]+'</b> '+HOBBY[i][1]+' — '+HOBBY[i][2];return;}
 const ph=t.closest('[data-p]');
 if(ph){const i=+ph.dataset.p;speak(PHR[i][0],false);ph.classList.toggle('open');return;}
 const hpc=t.closest('[data-hp]');
 if(hpc){const i=+hpc.dataset.hp;speak(HOBBY_PHR[i][0],false);hpc.classList.toggle('open');return;}
 const d=t.closest('[data-d]');
 if(d){const i=+d.dataset.d;speak(DLG[i][1],false);d.classList.toggle('open');return;}
 const rb=t.closest('[data-r]');
 if(rb){
  const i=+rb.dataset.r,v=rb.getAttribute('data-v');
  const box=document.getElementById('ro'+i);
  box.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.getAttribute('data-v')===RIDDLE[i][1])b.classList.add('ok');});
  if(v===RIDDLE[i][1]){window.__rs=(window.__rs||0)+1;speak(RIDDLE[i][1],false);}
  else rb.classList.add('bad');
  document.getElementById('rscore').textContent='Баллы: '+(window.__rs||0)+' / '+RIDDLE.length;
  return;
 }
 const gb=t.closest('[data-g]');
 if(gb){
  const i=+gb.dataset.g,inp=document.getElementById('g'+i),res=document.getElementById('gres'+i);
  if(inp.value.trim().toLowerCase()===GAPS[i][1].toLowerCase()){res.textContent='✅ Верно!';res.style.color='#3aa76d';speak(GAPS[i][0].replace('___',GAPS[i][1]),false);}
  else{res.textContent='❌ Правильно: '+GAPS[i][1];res.style.color='#d9534f';}
  return;
 }
 const sk=t.closest('[data-sk]');
 if(sk){sp[sk.dataset.sk]=+sk.dataset.v;sk.parentElement.querySelectorAll('button').forEach(b=>b.style.borderColor='');sk.style.borderColor='#f0b429';return;}
 const tb=t.closest('[data-t]');
 if(tb){
  const i=+tb.dataset.t,v=tb.getAttribute('data-v');
  tb.parentElement.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.getAttribute('data-v')===TEST[i][2])b.classList.add('ok');});
  if(v===TEST[i][2]){window.__ts=(window.__ts||0)+1;speak(TEST[i][2],false);}
  else tb.classList.add('bad');
  document.getElementById('tscore').textContent='Результат: '+(window.__ts||0)+' / 10';
  return;
 }
});
document.addEventListener('click',e=>{
 if(e.target&&e.target.id==='saySpeak'){
  const c0=['Russia','the UK'],c1=['the Kremlin and Red Square','the Tower of London','Lake Baikal','Edinburgh Castle'],c2=['Maslenitsa','Christmas','New Year','Easter'],c3=['playing board games','surfing the Net','riding a bike','going camping'];
  if(sp[0]===undefined){alert('Сначала выбери страну!');return;}
  let txt='My country is '+c0[sp[0]]+'. ';
  txt+='The capital city is '+(sp[0]===0?'Moscow':'London')+'. ';
  txt+='The famous landmark is '+c1[sp[1]!==undefined?sp[1]:0]+'. ';
  txt+='My favourite celebration is '+c2[sp[2]!==undefined?sp[2]:0]+'. ';
  txt+='Teenagers in my country like '+c3[sp[3]!==undefined?sp[3]:0]+'. ';
  txt+='I love my country!';
  const out=document.getElementById('speakOut');
  out.style.display='block';out.innerHTML='<b>Твой рассказ:</b><br>'+txt;
  speak(txt,false);
 }
});
